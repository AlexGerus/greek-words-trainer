<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Греческий: слова в контексте</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22 font-size=%2290%22><text y=%2280%22>🦉</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Literata:opsz,wght@7..72,400;7..72,500;7..72,600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e8ecf6; --paper:#fbfcff; --rule:#d9e0f1; --margin:#e06a6e; --ink:#24359c; --text:#161a36; --muted:#59618a;
  --line:#d2d8ea; --ok:#23764f; --ok-bg:#e1f2e8; --bad:#b53a2b; --bad-bg:#fae6e2; --warn:#95600f; --warn-bg:#f7edd8;
  --tabbar:#fbfcff; --chip:#ffffff; --shadow:rgba(24,34,110,.28);
  --serif:'Literata','Noto Serif',Georgia,'Times New Roman',serif;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1230; --paper:#161b40; --rule:#242b5b; --margin:#b44f5b; --ink:#afbdff; --text:#e7eafb; --muted:#9aa2cc;
    --line:#2a3265; --ok:#72d3a5; --ok-bg:#14342b; --bad:#ff9c88; --bad-bg:#3b1e23; --warn:#f0c173; --warn-bg:#382d18;
    --tabbar:#131838; --chip:#1a2049; --shadow:rgba(0,0,0,.5); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1230; --paper:#161b40; --rule:#242b5b; --margin:#b44f5b; --ink:#afbdff; --text:#e7eafb; --muted:#9aa2cc;
  --line:#2a3265; --ok:#72d3a5; --ok-bg:#14342b; --bad:#ff9c88; --bad-bg:#3b1e23; --warn:#f0c173; --warn-bg:#382d18;
  --tabbar:#131838; --chip:#1a2049; --shadow:rgba(0,0,0,.5); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:6px}
.wrap{max-width:560px;margin:0 auto;padding:14px 16px calc(96px + env(safe-area-inset-bottom))}
.gr{font-family:var(--serif);color:var(--ink)}

/* header */
.top{display:flex;align-items:center;gap:12px;padding:6px 0 14px}
.owl{font-size:28px;line-height:1}
.top h1{font-family:var(--serif);font-weight:600;font-size:21px;margin:0;line-height:1.2}
.top p{margin:2px 0 0;font-size:13.5px;color:var(--muted)}
.meter{height:4px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:6px;max-width:220px}
.meter i{display:block;height:100%;background:var(--ink);width:0}

/* setup */
.howto{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:2px 0;margin:0 0 18px}
.howto summary{list-style:none;cursor:pointer;padding:12px 0;font-weight:500;display:flex;justify-content:space-between;align-items:center}
.howto summary::-webkit-details-marker{display:none}
.howto summary::after{content:'+';font-size:20px;color:var(--muted);line-height:1}
.howto[open] summary::after{content:'–'}
.howto ul{margin:0 0 14px;padding-left:18px;font-size:14.5px}
.howto li{margin:0 0 8px}
.field{margin:0 0 18px}
.flabel{font-size:13.5px;color:var(--muted);margin:0 0 7px}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;padding:3px;background:var(--chip);gap:3px}
.seg button{flex:1;border:0;background:transparent;padding:9px 6px;border-radius:9px;font-size:14.5px;font-weight:500;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--ink);color:var(--paper)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--line);background:var(--chip);border-radius:999px;padding:6px 12px;font-size:14px;color:var(--text)}
.chip small{color:var(--muted);margin-left:4px;font-size:12.5px}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.chip.on small{color:var(--paper);opacity:.75}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:14px;width:100%;background:transparent;border:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:13px 0;text-align:left}
.toggle b{font-weight:500;display:block}
.toggle span.sub{font-size:13.5px;color:var(--muted)}
.sw{flex:none;width:46px;height:28px;border-radius:999px;background:var(--line);position:relative;transition:background .15s}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--paper);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.toggle.on .sw{background:var(--ink)}
.toggle.on .sw::after{transform:translateX(18px)}
.primary{display:block;width:100%;border:0;border-radius:14px;background:var(--ink);color:var(--paper);font-weight:600;font-size:17px;padding:15px;margin-top:18px}
.ghost{display:block;width:100%;border:1px solid var(--line);border-radius:14px;background:transparent;font-weight:500;padding:13px;margin-top:10px}
.empty{color:var(--muted);font-size:14.5px;text-align:center;padding:10px}

/* notebook page */
.page{position:relative;background-color:var(--paper);
  background-image:linear-gradient(90deg,transparent 36px,var(--margin) 36px,var(--margin) 37.5px,transparent 37.5px),
  repeating-linear-gradient(180deg,transparent 0,transparent 31px,var(--rule) 31px,var(--rule) 32px);
  border-radius:3px 12px 12px 3px;padding:18px 18px 20px 52px;
  box-shadow:0 1px 0 var(--line),0 18px 30px -22px var(--shadow)}
.page .lab{font-size:13px;color:var(--muted);line-height:32px;margin:0}
.prompt{font-size:clamp(27px,7.6vw,38px);line-height:1.22;margin:6px 0 4px;font-weight:500;word-break:break-word}
.prompt.ru{font-family:var(--serif);color:var(--text)}
.prompt.phrase{font-size:clamp(22px,6vw,28px)}
.hint{font-size:14.5px;color:var(--muted);margin:6px 0 0;line-height:1.45}
.hint em{font-style:normal;color:var(--text)}
.ans{border-top:1.5px dashed var(--rule);margin-top:16px;padding-top:12px;animation:rise .18s ease-out}
.ans .main{font-size:clamp(22px,6.2vw,30px);line-height:1.25;margin:0 0 4px;font-weight:500}
.ans .main.ru{font-family:var(--serif);color:var(--text)}
.ctx{margin:12px 0 0;padding:0;list-style:none}
.ctx li{display:flex;gap:8px;align-items:flex-start;padding:5px 0}
.ctx .g{font-family:var(--serif);color:var(--ink);font-size:17.5px;line-height:1.35}
.ctx .r{display:block;font-size:14px;color:var(--muted);line-height:1.35}
.ctxhead{font-size:13px;color:var(--muted);margin:14px 0 0}
.hook,.note{font-size:14.5px;line-height:1.45;margin:12px 0 0;padding:8px 10px;border-radius:8px}
.hook{background:var(--warn-bg);color:var(--text)}
.note{background:var(--bg);color:var(--text)}
.hook b,.note b{font-weight:600}
.say{flex:none;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--chip);display:inline-grid;place-items:center;padding:0;color:var(--ink)}
.say svg{width:17px;height:17px}
.say.big{width:76px;height:76px;margin:14px 0 6px}
.say.big svg{width:34px;height:34px}
.row{display:flex;gap:10px;align-items:center}
.timer{height:3px;background:var(--rule);border-radius:2px;overflow:hidden;margin:0 0 12px}
.timer i{display:block;height:100%;width:100%;transform-origin:left center;transform:scaleX(0);background:var(--muted);animation-name:tfill;animation-timing-function:linear;animation-fill-mode:forwards}
.paused .timer i{animation-play-state:paused}
@keyframes tfill{0%{transform:scaleX(0);background:var(--muted)}99.5%{background:var(--muted)}100%{transform:scaleX(1);background:var(--warn)}}
.tbar{display:flex;justify-content:space-between;align-items:center;margin:0 0 10px;color:var(--muted);font-size:14px}
.task{font-size:20px;line-height:1.35;margin:6px 0 0;color:var(--text);font-weight:600}
.tw{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 2px}
.tchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--chip);border-radius:999px;padding:4px 12px 4px 5px}
.tchip .g{font-family:var(--serif);color:var(--ink);font-size:16.5px}
.talkgr{font-family:var(--serif);color:var(--ink);font-size:20px;line-height:1.4}
.talkru{color:var(--muted);font-size:15px;margin:8px 0 0;line-height:1.45}
.hints{margin-top:14px;border-top:1.5px dashed var(--rule);padding-top:6px;animation:rise .18s ease-out}
.hints .ctx{margin-top:4px}
.hints .hl{margin:8px 0 0;font-size:15.5px;line-height:1.4;color:var(--text)}
.hints .hl .k{display:block;font-size:12.5px;color:var(--muted);margin-bottom:1px}
.letters{margin:12px 0 2px;font-family:var(--serif);font-size:25px;color:var(--ink);letter-spacing:.03em;line-height:1.35;word-break:break-word}
.letters .dots{color:var(--muted);letter-spacing:.22em;opacity:.75}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0 4px}
.choices.one{grid-template-columns:1fr}
.choices button{border:1px solid var(--line);background:var(--chip);border-radius:12px;padding:11px 10px;cursor:pointer;text-align:center}
.choices.one button{text-align:left}
.choices .g{font-family:var(--serif);color:var(--ink);font-size:18px;line-height:1.3}
.picked{font-size:14px;margin:0 0 10px;padding:7px 10px;border-radius:10px}
.picked.ok{background:var(--ok-bg);color:var(--ok)}
.picked.bad{background:var(--bad-bg);color:var(--bad)}
.picked .g{font-family:var(--serif);font-size:16px}
.hints .blank{min-width:2.6em}
.actrow{display:grid;grid-template-columns:1fr 1.35fr;gap:8px;margin-top:18px}
.actrow.one{grid-template-columns:1fr}
.actrow .primary,.actrow .ghost{margin-top:0}
.actrow .ghost{font-weight:600;color:var(--warn);border-color:var(--warn);background:var(--warn-bg)}
.actrow .ghost small{display:block;font-weight:500;font-size:12.5px;opacity:.85}
.grades.two{grid-template-columns:1fr 1fr}
.hintnote{font-size:13.5px;color:var(--muted);margin:14px 0 -6px;text-align:center}
.partner{margin-top:16px;border:1.5px dashed var(--ink);border-radius:10px;padding:10px 12px}
.partner .lab{line-height:1.3;margin-bottom:4px}
.sess-top{display:flex;align-items:center;gap:12px;margin:0 0 12px}
.sess-top .x{border:1px solid var(--line);background:var(--chip);border-radius:10px;padding:6px 12px;font-size:14px}
.sess-top .cnt{font-size:14px;color:var(--muted);margin-left:auto}
.bar{height:4px;background:var(--line);border-radius:4px;overflow:hidden;margin:0 0 16px}
.bar i{display:block;height:100%;background:var(--ink);transition:width .2s}
.grades{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:16px}
.grades button{border-radius:12px;padding:13px 4px;font-weight:600;font-size:14.5px;border:1.5px solid}
.g-again{background:var(--bad-bg);border-color:var(--bad)!important;color:var(--bad)}
.g-hard{background:var(--warn-bg);border-color:var(--warn)!important;color:var(--warn)}
.g-good{background:var(--ok);border-color:var(--ok)!important;color:var(--paper)}
.done h2,.sec h2{font-family:var(--serif);font-weight:600;font-size:24px;margin:4px 0 6px}
.done p{margin:0 0 12px;color:var(--muted)}
.list{margin:6px 0 0;padding:0;list-style:none}
.list li{padding:9px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px}
.list .g{font-family:var(--serif);color:var(--ink)}
.list .r{color:var(--muted);text-align:right;font-size:14.5px}

/* traps & forms */
.intro{color:var(--muted);font-size:14.5px;margin:0 0 14px}
.sent{font-family:var(--serif);font-size:clamp(21px,5.8vw,27px);line-height:1.4;margin:8px 0 2px}
.blank{display:inline-block;min-width:3.2em;border-bottom:2px solid var(--ink);color:var(--ink);text-align:center}
.blank.ok{color:var(--ok);border-color:var(--ok)}
.blank.bad{color:var(--bad);border-color:var(--bad)}
.opts{display:grid;gap:8px;margin-top:16px}
.opts button{border:1.5px solid var(--line);background:var(--chip);border-radius:12px;padding:13px 14px;font-family:var(--serif);font-size:19px;color:var(--ink);text-align:left}
.opts button.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.opts button.bad{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
.opts button:disabled{cursor:default}
.fb{margin-top:14px;font-size:15px;line-height:1.5;animation:rise .18s ease-out}
.fb .tr{font-family:var(--serif);font-size:16.5px;margin:0 0 6px}
.score{font-size:14px;color:var(--muted);display:flex;justify-content:space-between;margin:0 0 12px}
.pron{font-family:var(--serif);font-size:clamp(30px,8.5vw,40px);color:var(--ink);line-height:1.15;margin:4px 0 2px}
.lemma{font-size:15px;color:var(--muted);margin:0}
.lemma .gr{font-size:17px}
.ruform{font-family:var(--serif);font-size:18px;margin:8px 0 0}
.tag{display:inline-block;font-size:12px;border:1px solid var(--line);border-radius:6px;padding:1px 6px;color:var(--muted);margin-left:6px;vertical-align:middle;font-family:var(--sans)}
table.conj{width:100%;border-collapse:collapse;margin-top:12px;font-size:15px}
table.conj td{padding:5px 6px;border-bottom:1px solid var(--rule)}
table.conj td:first-child{color:var(--muted);width:32%}
table.conj td.f{font-family:var(--serif);color:var(--ink);font-size:17px}
table.conj td.rr{color:var(--muted);font-size:13.5px;text-align:right}
table.conj tr.hl td{background:var(--ok-bg)}
.endings{margin:0 0 14px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.endings summary{list-style:none;cursor:pointer;padding:11px 0;font-weight:500;display:flex;justify-content:space-between}
.endings summary::-webkit-details-marker{display:none}
.endings summary::after{content:'+';color:var(--muted);font-size:20px;line-height:1}
.endings[open] summary::after{content:'–'}
.endgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:4px 18px;padding:0 0 12px}
.endgrid div{font-size:14px}
.endgrid h4{margin:4px 0 4px;font-size:13.5px;font-weight:500;color:var(--muted)}
.endgrid p{margin:0;font-family:var(--serif);color:var(--ink);font-size:16px;line-height:1.6}

/* dictionary */
.search{width:100%;border:1px solid var(--line);background:var(--chip);border-radius:12px;padding:12px 14px;font:inherit;color:var(--text);margin:0 0 6px}
.dsec h3{font-family:var(--serif);font-weight:600;font-size:18px;margin:22px 0 4px}
.ditem{border-bottom:1px solid var(--line)}
.ditem summary{list-style:none;cursor:pointer;display:flex;align-items:baseline;gap:10px;padding:10px 0}
.ditem summary::-webkit-details-marker{display:none}
.ditem .g{font-family:var(--serif);color:var(--ink);font-size:17.5px;flex:0 1 auto}
.ditem .r{color:var(--muted);font-size:14.5px;flex:1 1 auto;text-align:right}
.dots{flex:none;display:inline-flex;gap:3px;align-self:center}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.dots i.f{background:var(--ok)}
.dbody{padding:0 0 12px}
.dbody .ctx{margin-top:2px}
.sync{margin:0 0 14px}
.sync-p{font-size:14px;color:var(--muted);margin:0 0 12px;line-height:1.45}
.sync-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sbtn{border:1px solid var(--line);background:var(--chip);border-radius:12px;padding:12px 8px;font-weight:600;font-size:15px;color:var(--ink)}
.sbtn.main{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.sbtn.wide{display:block;width:100%;margin:8px 0 12px}
.sync-alt{display:flex;flex-wrap:wrap;gap:6px 20px;margin:10px 0 12px}
.sync-alt button{background:none;border:0;padding:4px 0;color:var(--ink);text-decoration:underline;text-underline-offset:3px;font-size:14px}
.synctext{display:block;width:100%;min-height:96px;border:1px solid var(--line);background:var(--chip);border-radius:12px;padding:10px 12px;font:13px/1.4 ui-monospace,Menlo,Consolas,monospace;color:var(--text);resize:vertical;word-break:break-all;margin:0 0 6px}
.linkbtn{background:none;border:0;color:var(--bad);text-decoration:underline;padding:10px 0;font-size:14px;margin-top:26px}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--tabbar);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:5}
.tabs .in{display:flex;width:100%;max-width:560px}
.tabs button{flex:1;border:0;background:transparent;padding:9px 2px;font-size:13.5px;font-weight:500;color:var(--muted);border-radius:10px}
.tabs button.on{color:var(--ink);background:var(--bg)}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--text);color:var(--paper);padding:10px 14px;border-radius:10px;font-size:14px;max-width:calc(100% - 32px);opacity:0;pointer-events:none;transition:opacity .2s;z-index:9;text-align:center}
#toast.show{opacity:1}
@keyframes rise{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <span class="owl" aria-hidden="true">🦉</span>
    <div>
      <h1>Мои греческие слова</h1>
      <p id="stat"></p>
      <div class="meter"><i id="meter"></i></div>
    </div>
  </header>
  <main id="view"></main>
</div>
<nav class="tabs" aria-label="Разделы"><div class="in">
  <button data-act="tab" data-v="cards">Карточки</button>
  <button data-act="tab" data-v="traps">Ловушки</button>
  <button data-act="tab" data-v="forms">Формы</button>
  <button data-act="tab" data-v="talk">Рассказ</button>
  <button data-act="tab" data-v="dict">Словарь</button>
</div></nav>
<div id="toast" role="status"></div>

<script>
/* ============ DATA ============ */
const TOPICS = {
  va:'Глаголы на -ω', vm:'Глаголы на -ομαι / -άμαι', vo:'Глаголы на -ώ / -άω',
  sm:'Связки и частота', tm:'Время', pp:'Работа и знакомство', hm:'Дом, погода, одежда',
  fd:'Бар и еда', mn:'Деньги и покупки', tr:'Транспорт', bc:'Море и отдых', st:'Учёба и разное', aj:'Прилагательные', da:'Даты и праздники', nu:'Порядковые числительные', ho:'Дом и квартира', cl:'Уборка по дому', ku:'Кухня и посуда', se:'Погода и сезоны', re:'Аренда: объявление и осмотр', fr:'Друзья, семья, встречи', fu:'Мебель и предметы дома', ex:'Упражнение 26',
  w1:'16.09: выходные и семья', w2:'16.09: кто чей', w3:'16.09: город и жильё', w4:'16.09: живая речь',
  r1:'18.09: о себе', r2:'18.09: рынок и цены',
  a1:'20.09: звонок по объявлению', a2:'20.09: как пройти',
  b1:'23.09: день и погода', b2:'23.09: квартира и район', c1:'25.09: люди и разговор'
};
const VERB_TOPICS = ['va','vm','vo'];

/* [греч., рус., [[пример, перевод]...], зацепка, важно] */
const WORDS = {
va:[
 ['έχω','иметь',[['Έχω άγχος.','Я переживаю (досл. «имею стресс»).'],['Έχει κρύο.','Холодно.']]],

let grVoice=null, warnedVoice=false;
function loadVoices(){try{const vs=speechSynthesis.getVoices();grVoice=vs.find(v=>v.lang&&v.lang.toLowerCase().startsWith('el'))||null;}catch(e){}}
if('speechSynthesis' in window){loadVoices();try{speechSynthesis.onvoiceschanged=loadVoices;}catch(e){}}
function speak(text){
  if(!('speechSynthesis' in window)){toast('Этот браузер не умеет озвучивать текст');return;}
  const clean=String(text).replace(/___/g,'…').replace(/\s*=\s*/g,', ').replace(/\s*\/\s*/g,', ').replace(/[—–]/g,',');
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(clean); u.lang='el-GR'; u.rate=.85; if(grVoice)u.voice=grVoice;
    speechSynthesis.speak(u);
    if(!grVoice&&!warnedVoice){warnedVoice=true;setTimeout(()=>{loadVoices();if(!grVoice)toast('Греческий голос не найден. Его можно добавить в настройках речи телефона.');},600);}
  }catch(e){toast('Не получилось озвучить');}
}

const state={tab:'cards', sess:null, trap:null, form:{group:'vm',q:null,picked:null,score:0,n:0}, q:'', talk:{order:null,i:0,words:false,sample:false}, syncOpen:false, syncPaste:false, syncShow:''};

/* ============ CARDS ============ */
function available(){return ITEMS.filter(i=>settings.kind==='all'||i.type===settings.kind);}
function activeTopics(){const av=available();return settings.topics.filter(t=>av.some(i=>i.tops.includes(t)));}
function pool(){const av=available();const ts=activeTopics();return ts.length?av.filter(i=>i.tops.some(t=>ts.includes(t))):av;}
function pickSession(){
  const now=Date.now(), DAY=864e5, INT=[0,1,3,7,16];
  const W=[10,6,3,1.5,.7];
  const scored=pool().map(it=>{const s=prog[it.id];let w;
    if(!s)w=5;else{w=W[s.b]||1;if(now-s.t>INT[s.b]*DAY)w*=2;}
    return {it,k:Math.pow(Math.random(),1/w)};});
  scored.sort((a,b)=>b.k-a.k);
  return scored.slice(0,Math.min(settings.size,scored.length)).map(x=>x.it);
}
function startSession(){
  const q=pickSession();
  if(!q.length){toast('Нет карточек под эти настройки');return;}
  state.sess={queue:q,i:0,total:q.length,finished:0,revealed:settings.partner,hints:0,opts:null,picked:null,shownAt:Date.now(),paused:0,hiddenAt:0,late:false,first:{},hard:[],again:{}};
  render();
  if(settings.dir==='listen')setTimeout(()=>speak(q[0].gr),250);
}
function grade(g){
  const s=state.sess; const it=s.queue[s.i]; const p=prog[it.id];
  const b=p?p.b:-1;
  if(!(it.id in s.first))s.first[it.id]=g;
  let nb;
  if(g==='again')nb=0; else if(g==='hard')nb=Math.max(1,b); else nb=b<0?2:Math.min(4,b+1);
  prog[it.id]={b:nb,t:Date.now()}; saveProg();
  if(g!=='good'&&!s.hard.includes(it))s.hard.push(it);
  if(g==='again'&&(s.again[it.id]||0)<2){
    s.again[it.id]=(s.again[it.id]||0)+1;
    const pos=Math.min(s.queue.length,s.i+4);
    s.queue.splice(pos,0,it);
  }else s.finished++;
  s.i++; s.revealed=settings.partner; s.hints=0; s.opts=null; s.picked=null; s.shownAt=Date.now(); s.paused=0; s.hiddenAt=0; s.late=false;
  updateStat(); render();
  if(settings.dir==='listen'&&s.i<s.queue.length)setTimeout(()=>speak(s.queue[s.i].gr),200);
}

function plural(n,a,b,c){const m10=n%10,m100=n%100;if(m10===1&&m100!==11)return a;if(m10>=2&&m10<=4&&(m100<10||m100>=20))return b;return c;}

/* Таймер ответа: считаем время до «Показать ответ» (пауза, пока вкладка скрыта) */
function timeLimit(it){if(!settings.timer||settings.partner)return 0;let t=settings.timer*(it.type==='phrase'?2:1);if(settings.dir==='listen')t+=2;return t;}
function elapsed(s){const now=s.hiddenAt||Date.now();return Math.max(0,(now-s.shownAt-s.paused)/1000);}
function doReveal(){const s=state.sess;if(!s||s.revealed)return;const it=s.queue[s.i];const lim=timeLimit(it);s.late=!!lim&&elapsed(s)>lim;s.revealed=true;render();}
document.addEventListener('visibilitychange',()=>{const s=state.sess;if(!s)return;
  if(document.hidden){if(!s.hiddenAt)s.hiddenAt=Date.now();document.body.classList.add('paused');}
  else{if(s.hiddenAt){s.paused+=Date.now()-s.hiddenAt;s.hiddenAt=0;}document.body.classList.remove('paused');}});

/* Подсказки: примеры по одному, без перевода. В РУ→ΕΛ само слово в примере скрыто. */
const ARTS=new Set(['ο','η','το','οι','τα','τον','την','τη','του','της','των','τις','τους','ενα','ενας','μια']);
const ENDS=['ιεμαι','ομαι','αμαι','ουμαι','αω','ω','ος','ης','ας','ες','ου','ια','ιο','α','η','ο','ι','ε'];
function stemOf(t){for(const e of ENDS){if(t.length-e.length>=3&&t.endsWith(e))return t.slice(0,-e.length);}return t;}
function answerKeys(gr){
  const toks=norm(gr).replace(/[^\p{L}\s\/]/gu,' ').split(/[\s\/]+/).filter(t=>t&&!ARTS.has(t));
  return toks.map(t=>{const st=stemOf(t);
    if(st!==t)return {p:st};
    if(t.length===3&&t.endsWith('ω'))return {p:t.slice(0,2),max:6};
    return {w:t};});
}
/* прячет в тексте (например, в зацепке) греческие слова, совпадающие с ответом */
function hideAnswer(text,gr,repl){
  const keys=answerKeys(gr); if(!keys.length)return text;
  return text.replace(/\p{L}+/gu,w=>{const n=norm(w);return keys.some(k=>k.p?(n.startsWith(k.p)&&n.length<=(k.max||k.p.length+4)):n===k.w)?repl:w;});
}
function mainVariant(gr){return gr.split(/\s+[\/=]\s+/)[0].replace(/\s*\([^)]*\)/g,'').trim();}
const FUNCW=new Set(['στη','στην','στο','στον','στα','στις','στους','με','σε','θα','δεν','μου','σου','σας','μας','τι','πως','που','ποσο','απο','κατα','πολυ','να','για','και','αν','καλως']);
const GENDER={'ο':'мужской род','η':'женский род','το':'средний род','οι':'множественное число','τα':'множественное число, средний род','τον':'мужской род, винительный падеж','την':'женский род, винительный падеж','τη':'женский род, винительный падеж','του':'родительный падеж','της':'женский род, родительный падеж'};
const capf=t=>t.charAt(0).toUpperCase()+t.slice(1);
function gramOf(it){
  const v=mainVariant(it.gr); const words=v.match(/\p{L}+/gu)||[]; const n=words.length;
  const nw=`${n} ${plural(n,'слово','слова','слов')}`;
  if(it.type==='phrase')return `Фраза, ${nw}`;
  const f=words[0]||''; const fn=norm(f);
  if(it.type==='verb'){const suf=/μαι$/.test(fn)?f.slice(-4):/αω$/.test(fn)?'άω':/ώ$/.test(f)?'ώ':'ω';return `Глагол на -${suf}`+(n>1?`, ${nw}`:'');}
  if(GENDER[fn])return `${capf(GENDER[fn])}: ${f} …`+(n>2?` (${nw} с артиклем)`:'');
  if(n>1&&FUNCW.has(fn))return `Начинается с «${f}», ${nw}`;
  if(n>1)return `Выражение, ${nw}`;
  if(/ος$/.test(fn)&&/(ый|ий|ой)(\s|,|$|\()/.test(it.ru))return `Прилагательное на -${f.slice(-2)}`;
  const L=[...f].length; return `Одно слово, ${L} ${plural(L,'буква','буквы','букв')}`;
}
function letterLevels(it){
  const ws=(mainVariant(it.gr).match(/\p{L}+/gu)||[]).filter(w=>!ARTS.has(norm(w)));
  const mx=Math.max(1,...ws.map(w=>Math.floor([...w].length/2)));
  return Math.min(it.type==='phrase'?2:3,mx);
}
function lettersHTML(it,lv){
  return mainVariant(it.gr).split(/(\p{L}+)/u).map(part=>{
    if(!/\p{L}/u.test(part))return esc(part);
    if(ARTS.has(norm(part)))return esc(part);
    const ch=[...part]; const k=Math.max(1,Math.min(lv,Math.floor(ch.length/2)));
    return esc(ch.slice(0,k).join(''))+`<span class="dots">${'·'.repeat(ch.length-k)}</span>`;
  }).join('');
}
function pickChoices(it){
  const core=g=>norm(mainVariant(g)).split(/\s+/).filter(w=>!ARTS.has(w)).join(' ');
  const f=core(it.gr), art=norm(mainVariant(it.gr)).split(/\s+/)[0];
  const pool=ITEMS.filter(x=>x.type===it.type&&x.id!==it.id&&core(x.gr)!==f&&x.ru!==it.ru);
  const lead=g=>{const w=norm(mainVariant(g)).split(/\s+/)[0];return ARTS.has(w)||FUNCW.has(w)?w:'';};
  const wc=g=>(mainVariant(g).match(/\p{L}+/gu)||[]).length;
  const L0=lead(it.gr), W0=wc(it.gr);
  const sc=x=>{const g=core(x.gr);return (x.topic===it.topic?2:0)+(g[0]===f[0]?2:0)+(lead(x.gr)===L0?2:0)+(wc(x.gr)===W0?2:0)+(Math.abs(g.length-f.length)<=2?1:0)+Math.random()*2;};
  const others=pool.map(x=>[sc(x),x]).sort((p,q)=>q[0]-p[0]).slice(0,3).map(p=>p[1]);
  return shuffle([it,...others]).map(x=>x.id);
}
/* Лестница подсказок. РУ→ΕΛ: зацепка и грамматика → первые буквы → выбор из четырёх. Остальные режимы: примеры по одному. */
function hintSteps(it){
  if(settings.partner)return [];
  if(settings.dir==='ru'){const st=[{k:'gram'}];for(let i=1;i<=letterLevels(it);i++)st.push({k:'let',lv:i});st.push({k:'choice'});return st;}
  return it.ctx.map(([g])=>({k:'ex',t:g}));
}
function nextHintLabel(it,steps,n){
  const x=steps[n]; if(!x)return '';
  if(x.k==='gram')return it.hook?'зацепка и грамматика':'грамматика';
  if(x.k==='let')return x.lv===1?'первая буква':'ещё буква';
  if(x.k==='choice')return 'выбор из четырёх';
  return `пример ${n+1} из ${steps.length}`;
}
function hintsHTML(it,steps,n){
  if(!n)return '';
  const open=steps.slice(0,n); let h='';
  if(open[0].k==='ex'){
    h=`<ul class="ctx">${open.map(x=>`<li>${sayBtn(x.t)}<span><span class="g">${esc(x.t)}</span></span></li>`).join('')}</ul>`;
  }else{
    h+=`<p class="hl">${esc(gramOf(it))}</p>`;
    if(it.hook)h+=`<p class="hl"><span class="k">Зацепка</span>${esc(hideAnswer(it.hook,it.gr,'…'))}</p>`;
    const lets=open.filter(x=>x.k==='let');
    if(lets.length)h+=`<p class="letters">${lettersHTML(it,lets[lets.length-1].lv)}</p>`;
    if(open.some(x=>x.k==='choice')){
      const s=state.sess; if(!s.opts)s.opts=pickChoices(it);
      h+=`<div class="choices ${it.type==='phrase'?'one':''}">${s.opts.map((id,i)=>{const x=ITEMS.find(y=>y.id===id);return `<button data-act="pick" data-v="${esc(id)}"><span class="g">${esc(mainVariant(x.gr))}</span></button>`;}).join('')}</div>`;
    }
  }
  return `<div class="hints"><p class="ctxhead">${n>1?'Подсказки':'Подсказка'}</p>${h}</div>`;
}

function backHTML(it,showMain){
  let h='';
  if(showMain){
    if(settings.dir==='ru')h+=`<div class="row"><p class="main gr">${esc(it.gr)}</p>${sayBtn(it.gr)}</div>`;
    else if(settings.dir==='listen')h+=`<p class="main gr">${esc(it.gr)}</p><p class="main ru">${esc(it.ru)}</p>`;
    else h+=`<p class="main ru">${esc(it.ru)}</p>`;

  }

  if(it.note)h+=`<p class="note"><b>Важно:</b> ${esc(it.note)}</p>`;
  return h;
}
function renderCard(){

  :`<div class="actrow ${s.hints<H?'':'one'}">${s.hints<H?`<button class="ghost" data-act="hint">${s.hints?'Ещё подсказка':'Подсказка'}<small>${nextHintLabel(it,steps,s.hints)}</small></button>`:''}<button class="primary" data-act="reveal">Показать ответ</button></div>`}`;

    <p class="pron">${esc(PRON[idx])}</p>
    <p class="lemma"><span class="gr">${esc(v.l)}</span>, ${esc(v.ru)}<span class="tag">${esc(v.k)}</span></p>
    ${v.r?`<p class="ruform">${esc(v.r[idx])}</p>`:''}
    <div class="opts">${opts.map(o=>{
      let cls='';if(answered){if(o===right)cls='ok';else if(o===f.picked)cls='bad';}
      return `<button class="${cls}" data-act="form-pick" data-v="${esc(o)}" ${answered?'disabled':''}>${esc(o)}</button>`;}).join('')}</div>
    ${answered?`<div class="fb"><table class="conj">${v.f.map((x,i)=>`<tr class="${i===idx?'hl':''}"><td>${esc(PRON[i])}</td><td class="f">${esc(x)}</td>${v.r?`<td class="rr">${esc(v.r[i])}</td>`:''}</tr>`).join('')}</table></div>`:''}
  </article>
  ${answered?'<button class="primary" data-act="form-next">Дальше</button>':''}`;
}

function renderTalk(){

  if(!t.order){t.order=shuffle(TALK.map((_,i)=>i));t.i=0;t.words=false;t.sample=false;}
  if(t.i>=t.order.length)return `<div class="done"><p class="big">Все темы пройдены</p>
    <p class="sub">Лучше всего работает так: сначала рассказать вслух своими словами, и только потом смотреть образец.</p>

  const q=TALK[t.order[t.i]];

/* ============ SYNC (перенос прогресса) ============ */
/* Формат: GRW1:<запись>.<запись>… ; запись = хэш id (7 знаков base36) + уровень (0–4) + время в минутах (base36) */
function hid(id){let h=0x811c9dc5;for(let i=0;i<id.length;i++){h^=id.charCodeAt(i);h=Math.imul(h,16777619);}return (h>>>0).toString(36).padStart(7,'0');}
function exportCode(){
  const recs=ITEMS.filter(i=>prog[i.id]).map(i=>{const p=prog[i.id];return hid(i.id)+Math.max(0,Math.min(4,p.b|0))+Math.round((p.t||0)/6e4).toString(36);});
  return recs.length?'GRW1:'+recs.join('.'):'';
}
function parseCode(txt){
  const m=String(txt).replace(/\s+/g,'').match(/GRW1:([0-9a-z.]*)/i); if(!m)return null;
  const map=new Map(ITEMS.map(i=>[hid(i.id),i.id])); const out={};
  m[1].toLowerCase().split('.').forEach(r=>{if(r.length<9)return;const id=map.get(r.slice(0,7));const b=Number(r[7]);const t=parseInt(r.slice(8),36)*6e4;
    if(id&&b>=0&&b<=4&&t>0)out[id]={b,t};});
  return out;
}
function importText(txt){
  const inc=parseCode(txt);
  if(!inc){toast('Это не похоже на прогресс. Нужен файл или текст, сохранённый здесь же.');return;}
  const n=Object.keys(inc).length; if(!n){toast('В этом файле нет результатов');return;}
  let upd=0; Object.entries(inc).forEach(([id,r])=>{const cur=prog[id];if(!cur||r.t>cur.t){prog[id]=r;upd++;}});
  saveProg(); updateStat(); state.syncPaste=false; render();
  toast(upd?`Готово: обновлено ${upd} ${plural(upd,'карточка','карточки','карточек')} из ${n}`:'Здесь уже самый свежий прогресс, ничего не поменялось');
}
function progFileName(){const d=new Date(),z=x=>String(x).padStart(2,'0');return `greek-progress-${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}.txt`;}
function saveFile(){
  const code=exportCode(); if(!code){toast('Пока нечего сохранять: пройди хотя бы один подход');return;}
  const name=progFileName(); const blob=new Blob([code],{type:'text/plain'});
  try{
    const file=new File([blob],name,{type:'text/plain'});
    if(matchMedia('(pointer: coarse)').matches&&navigator.canShare&&navigator.canShare({files:[file]})){
      navigator.share({files:[file],title:'Прогресс: греческие слова'}).catch(e=>{if(!e||e.name!=='AbortError')downloadBlob(blob,name);});
      return;
    }
  }catch(e){}
  downloadBlob(blob,name);
}
function downloadBlob(blob,name){
  const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),5000);
}
function copyCode(){
  const code=exportCode(); if(!code){toast('Пока нечего сохранять: пройди хотя бы один подход');return;}
  const fallback=()=>{state.syncShow=code;render();const c=document.getElementById('synccode');if(c){c.focus();c.select();}};
  try{navigator.clipboard.writeText(code).then(()=>{state.syncShow='';toast('Скопировано. Вставь этот текст на другом устройстве.');},fallback);}catch(e){fallback();}
}
function syncHTML(){
  return `<details class="howto sync" id="sync" ${state.syncOpen?'open':''}><summary>Перенести прогресс на другое устройство</summary>
  <p class="sync-p">Сохрани файл здесь и загрузи его в другом браузере или на телефоне. Для каждой карточки останется более свежий результат, так что можно заниматься попеременно на разных устройствах.</p>
  <div class="sync-btns"><button class="sbtn main" data-act="exp-save">Сохранить файл</button><button class="sbtn" data-act="exp-load">Загрузить файл</button></div>
  <div class="sync-alt"><button data-act="exp-copy">Скопировать текстом</button><button data-act="exp-paste">Вставить текст</button></div>
  ${state.syncShow?`<textarea class="synctext" id="synccode" readonly>${esc(state.syncShow)}</textarea><p class="sync-p">Скопировать автоматически не получилось: выдели этот текст и скопируй вручную.</p>`:''}
  ${state.syncPaste?`<textarea class="synctext" id="syncin" placeholder="Вставь сюда текст, скопированный на другом устройстве" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></textarea><button class="sbtn main wide" data-act="exp-apply">Загрузить из текста</button>`:''}
  <input type="file" id="syncfile" accept=".txt,text/plain" hidden>
  </details>`;
}

/* ============ DICTIONARY ============ */
function dots(id){const b=prog[id]?prog[id].b:-1;let h='<span class="dots" aria-hidden="true">';for(let i=0;i<4;i++)h+=`<i class="${b>i?'f':''}"></i>`;return h+'</span>';}
function dictList(){
  const q=norm(state.q.trim());
  let out='';
  Object.keys(TOPICS).forEach(t=>{
    const items=ITEMS.filter(i=>i.tops.includes(t)&&(!q||norm(i.gr).includes(q)||norm(i.ru).includes(q)||i.ctx.some(c=>norm(c[0]).includes(q)||norm(c[1]).includes(q))));
    if(!items.length)return;
    out+=`<section class="dsec"><h3>${TOPICS[t]}</h3>${items.map(it=>`
      <details class="ditem"><summary><span class="g">${esc(it.gr)}</span><span class="r">${esc(it.ru)}</span>${dots(it.id)}</summary>
      <div class="dbody"><div class="row">${sayBtn(it.gr)}<span class="r" style="color:var(--muted);font-size:14px">Произнести</span></div>${backHTML(it,false)}</div></details>`).join('')}</section>`;
  });
  return out||'<p class="empty">Ничего не нашлось. Попробуй другое слово, по-гречески или по-русски.</p>';
}
function renderDict(){
  return `${syncHTML()}<input class="search" id="q" type="search" placeholder="Поиск: σηκώνομαι, вставать, στάση…" value="${esc(state.q)}" autocomplete="off">
  <div id="dlist">${dictList()}</div>
  <button class="linkbtn" data-act="reset">Сбросить прогресс</button>`;
}

/* ============ RENDER & EVENTS ============ */
function render(){
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.v===state.tab));
  let h='';
  if(state.tab==='cards')h=state.sess?renderCard():renderSetup();
  else if(state.tab==='traps')h=renderTraps();
  else if(state.tab==='forms')h=renderForms();
  else if(state.tab==='talk')h=renderTalk();
  else h=renderDict();
  $view.innerHTML=h;
  if(state.tab==='dict'){
    const q=document.getElementById('q');
    q.addEventListener('input',()=>{state.q=q.value;document.getElementById('dlist').innerHTML=dictList();});
    const d=document.getElementById('sync'); d.addEventListener('toggle',()=>{state.syncOpen=d.open;});
    const f=document.getElementById('syncfile');
    f.addEventListener('change',()=>{const file=f.files&&f.files[0]; if(!file)return;
      const rd=new FileReader(); rd.onload=()=>importText(rd.result); rd.onerror=()=>toast('Не удалось прочитать файл'); rd.readAsText(file); f.value='';});
  }
}
function handle(b){
  const act=b.dataset.act, v=b.dataset.v;
  switch(act){
    case 'tab': state.tab=v; render(); window.scrollTo(0,0); break;
    case 'say': speak(b.dataset.t); break;
    case 'set': { const k=b.dataset.k; settings[k]=(k==='size'||k==='timer')?Number(v):v; saveSet(); render(); break; }
    case 'topic': { const i=settings.topics.indexOf(v); if(i>=0)settings.topics.splice(i,1); else settings.topics.push(v); saveSet(); render(); break; }
    case 'alltopics': settings.topics=[]; saveSet(); render(); break;
    case 'partner': settings.partner=!settings.partner; saveSet(); render(); break;
    case 'start': startSession(); window.scrollTo(0,0); break;
    case 'reveal': doReveal(); break;
    case 'hint': { const s=state.sess; if(!s||s.revealed)break; const it=s.queue[s.i]; if(s.hints<hintSteps(it).length){s.hints++; render();} break; }
    case 'pick': { const s=state.sess; if(!s||s.revealed)break; s.picked=b.dataset.v; doReveal(); break; }
    case 'grade': grade(v); window.scrollTo(0,0); break;
    case 'quit': state.sess=null; render(); break;
    case 'trap-pick': { const t=state.trap; if(t.picked!==null)break; t.picked=Number(v); if(t.picked===0)t.score++; render(); break; }
    case 'trap-next': state.trap.i++; state.trap.picked=null; state.trap.opts=shuffle([0,1]); render(); window.scrollTo(0,0); break;
    case 'trap-restart': newTrapRound(); render(); break;
    case 'fgroup': state.form.group=v; newFormQ(); render(); break;
    case 'form-pick': { const f=state.form; if(f.picked!==null)break; f.picked=v; f.n++; if(v===f.q.v.f[f.q.idx])f.score++; render(); break; }
    case 'form-next': newFormQ(); render(); break;
    case 'talk-words': state.talk.words=true; render(); break;
    case 'talk-sample': state.talk.sample=true; render(); break;
    case 'talk-next': { const t=state.talk; t.i++; t.words=false; t.sample=false; render(); break; }
    case 'talk-restart': state.talk={order:null,i:0,words:false,sample:false}; render(); break;
    case 'exp-save': saveFile(); break;
    case 'exp-load': document.getElementById('syncfile').click(); break;
    case 'exp-copy': copyCode(); break;
    case 'exp-paste': state.syncPaste=!state.syncPaste; state.syncShow=''; render(); { const t=document.getElementById('syncin'); if(t)t.focus(); } break;
    case 'exp-apply': { const t=document.getElementById('syncin'); importText(t?t.value:''); break; }
    case 'reset': if(confirm('Сбросить весь прогресс по карточкам?')){prog={};saveProg();updateStat();render();toast('Прогресс сброшен');} break;
  }
}
document.addEventListener('click',e=>{
  const sb=e.target.closest('[data-act="say"]');
  if(sb){e.preventDefault();e.stopPropagation();speak(sb.dataset.t);return;}
  const b=e.target.closest('[data-act]'); if(!b)return;
  if(b.tagName==='SUMMARY')return;
  handle(b);
});
document.addEventListener('keydown',e=>{
  if(state.tab!=='cards'||!state.sess||e.target.tagName==='INPUT')return;
  const s=state.sess; if(s.i>=s.queue.length)return;
  if((e.key===' '||e.key==='Enter')&&!s.revealed){e.preventDefault();doReveal();}
  else if(!s.revealed&&(e.key==='h'||e.key==='р')&&!settings.partner){const it=s.queue[s.i];if(s.hints<hintSteps(it).length){s.hints++;render();}}
  else if(!s.revealed&&s.opts&&['1','2','3','4'].includes(e.key)){s.picked=s.opts[Number(e.key)-1];doReveal();}
  else if(s.revealed&&['1','2','3'].includes(e.key)){const g=['again','hard','good'][Number(e.key)-1];grade(g==='good'&&(s.hints>0||s.late)&&!settings.partner?'hard':g);}
});
updateStat(); render();
</script>
